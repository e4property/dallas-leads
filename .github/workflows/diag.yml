name: Apt Diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe
        run: |
          lsb_release -a || true
          cat /etc/apt/apt-mirrors.txt 2>/dev/null | head
          ls /etc/apt/sources.list.d/
          cat /etc/apt/sources.list.d/*.sources 2>/dev/null | head -30
          for h in security.ubuntu.com archive.ubuntu.com azure.archive.ubuntu.com; do echo "== $h"; getent hosts $h || echo NO-DNS; timeout 10 curl -sI http://$h/ubuntu/ | head -1 || echo CURL-FAIL; done
      - name: Try install with security pocket removed
        run: |
          sudo sed -i '/security\.ubuntu\.com/d' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo grep -rl "security.ubuntu.com" /etc/apt/sources.list.d/ | xargs -r sudo sed -i 's#http://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#; s#https://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#'
          timeout 300 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update || echo UPDATE-FAILED
          timeout 400 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y tesseract-ocr && tesseract --version | head -1 || echo INSTALL-FAILED
